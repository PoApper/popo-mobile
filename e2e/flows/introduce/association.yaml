# 자치단체 목록과 상세. 'dev에서만 보이는 자치단체'는 dev 서버에서 영문 필드가 채워진 단체다.
appId: ${APP_ID}
name: association
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/set-language.yaml
- tapOn:
    id: tab-home
- tapOn:
    id: home-service-association
- extendedWaitUntil:
    # dev 서버에서 영문 필드가 비어 있어 두 언어 모두 한글로 보이는 단체
    visible: '도서관자치위원회.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: introduce-association-list-${LANGUAGE}
# 영문 이름은 정렬상 아래쪽에 있어 스크롤해서 찾는다.
- scrollUntilVisible:
    element: "${LANGUAGE == 'en' ? 'Student Org. that only shows at dev.*' : 'dev에서만 보이는 자치단체.*'}"
    direction: DOWN
    centerElement: true
- tapOn: "${LANGUAGE == 'en' ? 'Student Org. that only shows at dev.*' : 'dev에서만 보이는 자치단체.*'}"
- extendedWaitUntil:
    visible: "${LANGUAGE == 'en' ? 'Leader' : '대표자'}"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: introduce-association-detail-${LANGUAGE}
