# 모든 PR에서 도는 기본 회귀: 하단 탭 4개를 ${LANGUAGE}로 연다.
appId: ${APP_ID}
name: smoke
tags:
  - smoke
---
- runFlow: common/launch.yaml
- runFlow: common/set-language.yaml
- tapOn:
    id: tab-home
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: smoke-home-${LANGUAGE}
- tapOn:
    id: tab-paxi
# 방 목록 조회가 끝날 때까지 기다린다.
- extendedWaitUntil:
    notVisible:
      id: paxi-room-list-loading
    timeout: 10000
# 카드는 각자 상세를 받은 뒤에 그려지므로 카드가 뜰 때까지 기다린다(방이 없으면 5초 뒤 진행).
- extendedWaitUntil:
    visible: '(Departs .*|.* 출발)'
    timeout: 5000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: smoke-paxi-${LANGUAGE}
- tapOn:
    id: tab-my-reservation
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: smoke-my-reservation-${LANGUAGE}
- tapOn:
    id: tab-my-info
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: smoke-my-info-${LANGUAGE}
