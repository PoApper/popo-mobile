# 내 정보 > 비밀번호 변경 모달을 연다. 비밀번호는 실제로 바꾸지 않고 취소로 닫는다.
appId: ${APP_ID}
name: change-password-modal
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/set-language.yaml
# 언어 설정을 마치면 화면이 아래쪽에 있으므로 위로 올리며 찾는다.
- scrollUntilVisible:
    element:
      id: change-password-button
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: change-password-button
- extendedWaitUntil:
    visible: "${LANGUAGE == 'en' ? 'Enter your new password.' : '새로운 비밀번호를 입력해주세요.'}"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: auth-change-password-modal-${LANGUAGE}
- tapOn: "${LANGUAGE == 'en' ? 'Cancel' : '취소'}"
