# 생활백서 목록, 외부 링크 확인 창, 셔틀버스 시간표.
appId: ${APP_ID}
name: whitebook
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/set-language.yaml
- tapOn:
    id: tab-home
- tapOn:
    id: home-service-whitebook
# 항목 제목은 서버 값이라 언어와 무관하다. iOS는 카드 안 문구를 한 라벨로 합치므로 앞부분만 맞춘다.
- extendedWaitUntil:
    visible: 'POSTECH 복지회.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: campus-whitebook-list-${LANGUAGE}
- tapOn: 'POSTECH 복지회.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: campus-whitebook-link-alert-${LANGUAGE}
- tapOn: "${LANGUAGE == 'en' ? 'Cancel' : '취소'}"
- tapOn: '교내 셔틀버스 시간표.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: campus-shuttle-top-${LANGUAGE}
- scrollUntilVisible:
    element: "${LANGUAGE == 'en' ? 'Contact: .*' : '문의처: .*'}"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: campus-shuttle-notes-${LANGUAGE}
