# Disable this workflow (25/04/28)
# Due to heavy bundle size, and security issue, we need to disable this workflow

name: Android APK Build
on:
  push:
    branches:
      - main

jobs:
  build_apk:
    if: false # This disables the entire workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/popo-release-key.keystore
      - name: Build Release APK
        env:
          POPO_KEY_PASSWORD: ${{ secrets.POPO_KEY_PASSWORD }}
          POPO_KEYSTORE_PASSWORD: ${{ secrets.POPO_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
