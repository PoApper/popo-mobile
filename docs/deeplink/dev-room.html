<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paxi(Dev) - 택시팟 참여하기</title>

    <!-- iOS Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=6743666761" />

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #fa5721 0%, #ff8a5b 100%);
        color: white;
        text-align: center;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 12px;
      }

      p {
        font-size: 15px;
        opacity: 0.9;
        margin: 6px 0;
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .button {
        display: inline-block;
        background: white;
        color: #fa5721;
        padding: 12px 22px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        margin: 8px 4px;
      }

      .button:hover {
        background: #f3f3f3;
      }

      #status {
        margin-top: 16px;
        font-size: 14px;
      }
    </style>

    <script>
      // DOM이 로드된 후 실행
      document.addEventListener('DOMContentLoaded', function () {
        /**
         * UUID 형식 검증 (RFC 4122)
         */
        const isValidUUID = uuid => {
          const uuidRegex =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          return uuidRegex.test(uuid);
        };

        const path = window.location.pathname;
        let roomUuid = null;

        // /room/ 경로에서 UUID 추출 및 검증
        if (path.startsWith('/room/')) {
          const extracted = path.replace('/room/', '').split('/')[0]; // path traversal 방지
          if (isValidUUID(extracted)) {
            roomUuid = extracted;
          }
        }

        const ua = navigator.userAgent;
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);

        const iosStoreUrl =
          'https://apps.apple.com/us/app/popo-%ED%8F%AC%EC%8A%A4%ED%85%8C%ED%82%A4%EC%95%88%EC%9D%98-%ED%95%84%EC%88%98-%EC%95%B1/id6743666761';
        const androidStoreUrl =
          'https://play.google.com/store/apps/details?id=com.popomobile';

        // UUID가 유효하지 않은 경우 에러 메시지 표시
        if (!roomUuid) {
          const statusEl = document.getElementById('status');
          const spinner = document.querySelector('.spinner');
          if (spinner) spinner.style.display = 'none';
          if (statusEl) {
            statusEl.textContent = '유효하지 않은 방 링크입니다.';
            statusEl.style.color = '#ffebee';
          }
          return;
        }

        // 1️⃣ 앱 열기 시도 (플랫폼별 1회)
        if (isIOS) {
          window.location.href = `popo-dev://room/${roomUuid}`;
        } else if (isAndroid) {
          window.location.href =
            `intent://room/${roomUuid}` +
            `#Intent;scheme=popo-dev;package=com.popomobile;end`;
        }

        // 2️⃣ fallback: 일정 시간 후 스토어 이동
        const fallbackDelay = isIOS ? 2000 : 1500;

        setTimeout(() => {
          const statusEl = document.getElementById('status');
          if (statusEl) {
            statusEl.textContent =
              '앱을 열 수 없습니다. 앱 스토어로 이동합니다...';
          }

          if (isIOS) {
            window.location.href = iosStoreUrl;
          } else if (isAndroid) {
            window.location.href = androidStoreUrl;
          } else {
            // 데스크톱
            if (statusEl) {
              statusEl.textContent = '이 링크는 모바일 기기에서 열어주세요.';
            }
            const spinner = document.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
          }
        }, fallbackDelay);
      });
    </script>
  </head>

  <body>
    <div class="spinner"></div>
    <h1>Paxi(Dev) 택시팟 참여하기</h1>
    <p id="status">앱에서 열기를 시도 중입니다...</p>

    <div style="margin-top: 28px">
      <p style="font-size: 13px">수동으로 열기</p>
      <a
        href="https://apps.apple.com/us/app/popo-%ED%8F%AC%EC%8A%A4%ED%85%8C%ED%82%A4%EC%95%88%EC%9D%98-%ED%95%84%EC%88%98-%EC%95%B1/id6743666761"
        class="button">
        iOS 앱 다운로드
      </a>
      <a
        href="https://play.google.com/store/apps/details?id=com.popomobile"
        class="button">
        Android 앱 다운로드
      </a>
    </div>

    <p style="font-size: 12px; margin-top: 26px; opacity: 0.7">
      앱이 설치되어 있다면 자동으로 열립니다.<br />
      열리지 않는 경우 위 버튼을 눌러주세요.
    </p>
  </body>
</html>
